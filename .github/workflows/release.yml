# Builds the extension zip on every pull request, and publishes a GitHub release whenever a
# push to main changes the version in manifest.json. Configured releases also go to the Chrome
# Web Store. See RELEASING.md.
name: Release

on:
  pull_request:
  push:
    branches: [main]
    paths: [manifest.json]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and tags, to find the last release for the notes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A push that touches manifest.json without changing the version publishes nothing.
      - name: Check for a new version
        id: version
        if: github.event_name == 'push'
        run: |
          tag="v$(node -p "require('./manifest.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: simple-tracker-for-chatgpt
          path: dist/*.zip

      # The notes are the ones written for users in release-notes/changelog.json, the same the
      # Release Notes page shows, with the commits since the last release folded away below. A
      # version without notes lists just the commits. Commits go straight to main, so they stand in
      # for pull requests.
      - name: Write release notes
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          notes=$(node scripts/release-notes.mjs "$prev")
          {
            if [ -n "$notes" ]; then
              echo "$notes"
              echo
              echo "<details><summary>Commits</summary>"
              echo
              git log --no-merges --format='* %s (%h)' "${prev:+$prev..}HEAD"
              echo
              echo "</details>"
            else
              echo "## Changes"
              echo
              git log --no-merges --format='* %s (%h)' "${prev:+$prev..}HEAD"
            fi
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --target "$GITHUB_SHA" --notes-file notes.md

  chrome-web-store:
    needs: build
    if: >-
      needs.build.outputs.new == 'true' &&
      vars.CWS_PUBLISHER_ID != '' &&
      vars.CWS_SERVICE_ACCOUNT != '' &&
      vars.CWS_WORKLOAD_IDENTITY_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/chrome-web-store.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
